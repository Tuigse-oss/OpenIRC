# cargo-deny policy for OpenIRC. Run: cargo deny check
# The same RustSec database is used by `cargo audit`.

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails the check except the ones listed here, each
# with the reason it does not apply.
ignore = [
    # ttf-parser is unmaintained. It reaches OpenIRC only through winit's
    # Wayland client-side decorations (winit -> sctk-adwaita -> ab_glyph).
    # OpenIRC never parses fonts with it; egui uses its own font stack.
    # Revisit when eframe/winit move off sctk-adwaita.
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit sctk-adwaita; not used by OpenIRC code" },
    # zbus 6 absorbed zvariant, zvariant_derive and zbus_names, so their
    # older lines are marked unmaintained: not a vulnerability, and with no
    # patched version. They reach OpenIRC only through egui's Linux
    # screen-reader bridge (eframe -> egui-winit -> accesskit_winit ->
    # accesskit_unix, AT-SPI over D-Bus), and even the newest accesskit_unix
    # (0.24) still needs zbus 5. Revisit when accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; only via accesskit_unix, which still needs zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; only via accesskit_unix, which still needs zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; only via accesskit_unix, which still needs zbus 5" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
# Several GUI crates pull two major versions of the same helper; that is a
# size cost, not a defect, so it is reported but does not fail the check.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
