[package]
name = "openirc"
version = "0.1.0"
edition = "2024"
description = "OpenIRC, a native Rust IRC client"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = "0.36.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
libc = "0.2"
ring = "0.17"
encoding_rs = "0.8"
socket2 = "0.6"
regex = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[build-dependencies]
winresource = "0.1"

[features]
# Builds `openirc::bench` and `examples/bench.rs`.
bench = []

[[example]]
name = "bench"
required-features = ["bench"]

[profile.release]
# Line tables keep profiles (OPENIRC_PROFILE=1) and crash reports readable.
debug = "line-tables-only"
# One code unit and whole-program optimization: a slower build, faster
# frames. The benchmarks in scripts/check.sh guard the effect.
codegen-units = 1
lto = "thin"
