name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please leave out passwords, private messages, and anything personal in paths (you can replace your user name with `<user>`).
  - type: input
    id: version
    attributes:
      label: OpenIRC version or commit
      placeholder: v0.1.0, or the commit you built
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 26.04 (Wayland), ...
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: IRC network or server software, if it matters
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, what you expected, and what OpenIRC did instead. The raw log window (/debug) helps for protocol problems.
    validations:
      required: true
