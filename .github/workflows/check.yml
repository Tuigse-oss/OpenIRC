# Every push to main and every pull request runs the same checks as
# scripts/check.sh (a branch with a pull request is checked once, as the
# pull request, not again as a push): formatting, clippy (Linux, Windows,
# with and without the bench feature), the tests, RustSec through cargo
# audit and cargo deny, and the benchmarks.
#
# The benchmarks are compared with the base of the change, built and run
# on the same runner just before (scripts/bench-base.sh), the best of
# three rounds on each side: a pull request that makes a benchmark more
# than BENCH_TOLERANCE percent slower than main fails. Results from
# another run are no use for this: shared runners differ from each other
# by more than any change in the code, and even one runner has moments of
# contention that double a short benchmark.
name: check

# Third-party actions are pinned to a commit, with the release it is in a
# comment: a tag can be moved to other code, a commit cannot. Dependabot
# moves these pins to new releases like any other update. Actions from
# GitHub itself (actions/*, github/*) keep their major-version tags.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new RustSec advisory shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit is built too.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit,cargo-deny
      - name: Benchmarks of the base, on this runner
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The best of three rounds, on both sides: one moment of
          # contention on the runner then spoils a round, not the result.
          BENCH_ROUNDS: 3
        run: scripts/bench-base.sh "$BASE"
      - name: All checks
        env:
          BENCH_TOLERANCE: 50
          BENCH_ROUNDS: 3
          # The base cannot know a benchmark this change adds.
          BENCH_ALLOW_NEW: 1
        run: scripts/check.sh
      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            target/bench-baseline.txt
            target/bench-latest.txt
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features bench -- -D warnings
      - name: Tests
        run: cargo test
