name: release

# A version tag builds, tests and packages the Windows program, writes
# SHA256SUMS.txt, attests the files, and creates a draft release to check
# and publish by hand. A manual run builds the same files as a workflow
# artifact, without a release.
#
# Third-party actions are pinned to a commit, with the release it is in a
# comment; actions from GitHub itself keep their major-version tags (see
# check.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit,cargo-deny,cargo-about@0.9
      - name: Read the version and check the tag matches Cargo.toml
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version $version is not plain X.Y.Z"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: RustSec
        shell: bash
        run: |
          cargo audit
          cargo deny check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Check the program reports the release version
        shell: pwsh
        run: |
          $actual = "$(& target\release\openirc.exe --version)".Trim()
          $expected = "openirc $env:VERSION"
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "openirc.exe --version printed '$actual', not '$expected' (exit $LASTEXITCODE)"
          }
          Write-Host "ok: $actual"
      - name: Package
        shell: bash
        # The program ships with its licenses and the notices the licenses
        # of the crates and fonts in it require, never as a bare exe.
        run: |
          mkdir -p package dist
          cp target/release/openirc.exe LICENSE-MIT LICENSE-APACHE README.md package/
          scripts/third-party-notices.sh package/THIRD-PARTY-NOTICES.txt
          (cd package && 7z a -tzip "../dist/OpenIRC-$TAG-x86_64-windows.zip" ./*)
          (cd dist && sha256sum OpenIRC-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Attest build provenance
        # Free for public repositories.
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/OpenIRC-*
      - name: Upload the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: OpenIRC-${{ env.TAG }}-test-build
          path: dist/*
          if-no-files-found: error
      - name: Create a draft release
        # A draft stays unpublished until it is checked and released by hand.
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "OpenIRC $TAG" --generate-notes
